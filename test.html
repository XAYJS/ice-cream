<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS System - Login / Register</title>
    <!-- นำเข้า Tailwind CSS ผ่าน CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-gray-900 px-4">

    <div class="w-full max-w-md rounded-xl bg-gray-800 p-8 shadow-2xl border border-gray-700">
        
        <!-- หัวข้อฟอร์ม -->
        <h2 id="form-title" class="mb-6 text-center text-3xl font-extrabold text-white">
            เข้าสู่ระบบ POS 🛒
        </h2>

        <!-- กล่องแจ้งเตือน Error -->
        <div id="error-box" class="hidden mb-4 rounded-lg bg-red-500/10 p-3 text-sm text-red-400 border border-red-500/20 text-center"></div>

        <!-- กล่องแจ้งเตือน Success -->
        <div id="success-box" class="hidden mb-4 rounded-lg bg-green-500/10 p-3 text-sm text-green-400 border border-green-500/20 text-center"></div>

        <!-- ฟอร์มกรอกข้อมูล -->
        <form id="auth-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300">Username</label>
                <input
                    type="text"
                    id="username"
                    required
                    class="mt-1 w-full rounded-lg bg-gray-700 border border-gray-600 px-4 py-2 text-white focus:border-indigo-500 focus:outline-none"
                    placeholder="กรอกชื่อผู้ใช้งาน..."
                />
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300">Password</label>
                <input
                    type="password"
                    id="password"
                    required
                    class="mt-1 w-full rounded-lg bg-gray-700 border border-gray-600 px-4 py-2 text-white focus:border-indigo-500 focus:outline-none"
                    placeholder="••••••••"
                />
            </div>

            <button
                type="submit"
                id="submit-btn"
                class="w-full rounded-lg bg-indigo-600 py-2.5 font-semibold text-white transition hover:bg-indigo-500 active:scale-[0.98]"
            >
                เข้าสู่ระบบ
            </button>
        </form>

        <!-- ปุ่มสลับโหมด Login / Register -->
        <div class="mt-6 text-center text-sm text-gray-400">
            <span id="toggle-text">ยังไม่มีบัญชีใช่ไหม?</span>
            <button
                type="button"
                id="toggle-btn"
                class="ml-1 font-medium text-indigo-400 hover:underline focus:outline-none"
            >
                สมัครสมาชิกที่นี่
            </button>
        </div>

    </div>

    <!-- ส่วนจัดการ JavaScript -->
    <script>
        // ตั้งค่า API URL ไปที่ Port 5000 ตามที่คุณต้องการ
        const API_URL = 'http://localhost:5000/api/v1'; 
        
        let isLoginMode = true; // ค่าเริ่มต้นเป็นโหมด Login

        const formTitle = document.getElementById('form-title');
        const authForm = document.getElementById('auth-form');
        const submitBtn = document.getElementById('submit-btn');
        const toggleText = document.getElementById('toggle-text');
        const toggleBtn = document.getElementById('toggle-btn');
        const errorBox = document.getElementById('error-box');
        const successBox = document.getElementById('success-box');

        // ฟังก์ชันสลับโหมด Login <-> Register
        toggleBtn.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            errorBox.classList.add('hidden');
            successBox.classList.add('hidden');
            authForm.reset();

            if (isLoginMode) {
                formTitle.textContent = 'เข้าสู่ระบบ POS 🛒';
                submitBtn.textContent = 'เข้าสู่ระบบ';
                toggleText.textContent = 'ยังไม่มีบัญชีใช่ไหม?';
                toggleBtn.textContent = 'สมัครสมาชิกที่นี่';
            } else {
                formTitle.textContent = 'สมัครสมาชิกใหม่ 📝';
                submitBtn.textContent = 'สมัครสมาชิก';
                toggleText.textContent = 'มีบัญชีอยู่แล้วใช่ไหม?';
                toggleBtn.textContent = 'เข้าสู่ระบบ';
            }
        });

        // จัดการเมื่อกด Submit ฟอร์ม
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.add('hidden');
            successBox.classList.add('hidden');

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // ชี้ไปยัง endpoint /auth/login หรือ /auth/register
            const endpoint = isLoginMode ? `${API_URL}/auth/login` : `${API_URL}/auth/register`;

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'เกิดข้อผิดพลาดบางอย่าง');
                }

                if (isLoginMode) {
                    // 1. บันทึก Token ทั้งคู่ลงใน localStorage
                    localStorage.setItem('accessToken', data.accessToken);
                    localStorage.setItem('refreshToken', data.refreshToken);
                    if (data.user) {
                        localStorage.setItem('user', JSON.stringify(data.user));
                    }

                    successBox.textContent = 'เข้าสู่ระบบสำเร็จ! กำลังพาไปหน้า POS...';
                    successBox.classList.remove('hidden');
                    
                    // 2. พาไปหน้า pos.html หลังจากผ่านไป 1 วินาที
                    setTimeout(() => {
                        window.location.href = 'pos.html'; 
                    }, 1000);

                } else {
                    // สมัครสมาชิกสำเร็จ สลับกลับมาหน้า Login
                    successBox.textContent = 'สมัครสมาชิกสำเร็จ! กรุณาเข้าสู่ระบบ';
                    successBox.classList.remove('hidden');
                    isLoginMode = true;
                    formTitle.textContent = 'เข้าสู่ระบบ POS 🛒';
                    submitBtn.textContent = 'เข้าสู่ระบบ';
                    toggleText.textContent = 'ยังไม่มีบัญชีใช่ไหม?';
                    toggleBtn.textContent = 'สมัครสมาชิกที่นี่';
                    authForm.reset();
                }

            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
